name: Daily experiment run

on:
  # GitHub cron is UTC. These two slots cover 3:30 PM Eastern Standard and Daylight Time;
  # run_daily.py checks local ET time so only the matching slot starts the workflow.
  schedule:
    - cron: "30 19 * * *"
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Serialize scheduled and manually started runs so they cannot overwrite each other's data.
concurrency:
  group: daily-experiment-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - name: Run experiments
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            uv run python run_daily.py --scheduled
          else
            uv run python run_daily.py
          fi
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Commit experiment data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d experiments ]; then
            git add -A -- experiments/
          fi
          if git diff --cached --quiet; then
            echo "No experiment data changes to commit."
          else
            git commit -m "Persist daily experiment data"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
